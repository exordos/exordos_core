name: "secrets-example"
uuid: "0f5d1c6b-2a48-4c33-9f7e-8b1d5a90c4e2"
description: "Exordos opaque secrets example"
schema_version: 1
version: "0.0.1"
api_version: "v1"

requirements:
  core:
    from_version: "0.0.0"

resources:
  $core.secret.secrets:
    # The value is supplied by the user and is never returned by a read.
    # Reference it from a manifest with the `:value` link parameter.
    grafana_api_token:
      name: "grafana-api-token"
      project_id: "12345678-c625-4fee-81d5-f691897b8142"
      constructor:
        kind: plain
      value: "glsa_XXXXXXXXXXXXXXXX"

    # A default value stands in until someone sets a value through the
    # API. Declare one whenever the manifest knows a workable value: a
    # secret with neither holds every element that reads it.
    license_key:
      name: "license-key"
      description: "License key for the reporting add-on"
      project_id: "12345678-c625-4fee-81d5-f691897b8142"
      constructor:
        kind: plain
      default_value: "TRIAL-0000-0000-0000"

    database_connection_string:
      name: "database-connection-string"
      description: "Connection string for the external analytics database"
      project_id: "12345678-c625-4fee-81d5-f691897b8142"
      constructor:
        kind: plain
      value: "postgresql://analytics:s3cr3t@db.example.com:5432/analytics"
