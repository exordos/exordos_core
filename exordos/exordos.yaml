# Build section. It specifies the build process of the project
build:

  # Dependencies of the project
  deps:
    # Exordos project
    - dst: /opt/exordos_core
      # Local path
      path:
        src: ../../exordos_core
      exclude:
        - .venv
        - .tox
        - .pytest_cache
        - .ruff_cache
        - build
        - cover
        - output
        # Agent scaffolding, and git worktrees are kept under it -- whole
        # checkouts with virtualenvs of their own, which the names above do
        # not reach because they only match at the top level. A build that
        # meets one fills the provisioning disk and dies in the upload.
        - .claude

    # Binary artifacts. Kernel, initrd, boot loaders.
    - dst: /opt/exordos_core/artifacts/undionly.kpxe
      # Local path
      http:
        src: https://repo.exordos.com/seed_os/2.0.2/undionly.kpxe
    - dst: /opt/exordos_core/artifacts/initrd.img
      # Local path
      http:
        src: https://repo.exordos.com/seed_os/2.0.2/initrd.img
    - dst: /opt/exordos_core/artifacts/vmlinuz
      # Local path
      http:
        src: https://repo.exordos.com/seed_os/2.0.2/vmlinuz

    # Take SDK from a local path for development purposes.
    - dst: /opt/gcl_sdk
      optional: true
      path:
        env: LOCAL_GENESIS_SDK_PATH
      # A developer checkout carries its virtualenvs; uploading them fills
      # the build disk before the image is provisioned.
      exclude:
        - .git
        - .venv
        - .tox
        - .claude
        - build
        - dist

    # evpn_connector source for the ovs_evpn fabric. Optional: only builds
    # bringing this in get the EVPN forwarder venv (mirrors the SDK dev path).
    # gobgpd itself is fetched at provision time in install.sh (its GitHub
    # release URL 302-redirects, which the build's http-dep fetcher can't follow).
    - dst: /opt/evpn_connector
      optional: true
      path:
        env: LOCAL_EVPN_CONNECTOR_PATH
      exclude:
        - .git
        - .venv
        - .tox
        - .claude
        - build
        - dist

  # List of elements in the project
  elements:
    # List of images in the element
    - manifest: manifests/core.yaml.j2
      artifacts:
        # Generated rather than committed, so it has to be written here
        # before it can be published.
        - script: images/build_openapi_spec.sh
          artifacts:
            - ../docs/openapi/openapi_user.yaml
      images:
      - name: exordos-core
        format: GEN_IMG_FORMAT_CORE=qcow2

        # OS profile for the image
        profile: exordos_base
        profile_version: "1.3.7"

        # Provisioning script
        script: images/install.sh

        # Override image build parameters, for instance Packer parameters
        override:
          # For development purposes it's handy to have more space.
          disk_size: "10G"

        envs:
          - ALLOW_USER_PASSWD
          - FREQUENT_LOG_VACUUM
          # gobgp fetch source override (local mirror for offline/flaky-GitHub
          # builds); a failed fetch fails the build.
          - GOBGP_URL
    # eco manifest must be after core manifest!
    - manifest: manifests/ecosystem_realm.yaml.j2
    - manifest: manifests/exordos_docs.yaml.j2
      artifacts:
        - script: images/build_docs.sh
          flatten: true
          artifacts:
            - ../exordos_docs/
