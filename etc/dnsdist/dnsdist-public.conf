-- disable security status polling via DNS
setSecurityPollSuffix("")

setLocal("0.0.0.0:5333")

--Private DNS
newServer({address="127.0.0.1:5300", pool="privatedns", healthCheckMode="up"})

-- Core DNS domains (dynamic). The file is maintained by exordos core
-- (one domain per line); it is re-read every second by maintenance().
privatedns_domains_file = "/etc/dnsdist/privatedns-domains.txt"
privatedns_smn = newSuffixMatchNode()
privatedns_last = nil

function maintenance()
  local f = io.open(privatedns_domains_file, "r")
  local content = ""
  if f then
    content = f:read("*a") or ""
    f:close()
  end
  if content == privatedns_last then
    return
  end
  local smn = newSuffixMatchNode()
  for line in content:gmatch("[^\r\n]+") do
    local ok, name = pcall(newDNSName, line)
    if ok then
      smn:add(name)
    else
      errlog("Skipping invalid domain in " .. privatedns_domains_file .. ": " .. line)
    end
  end
  privatedns_smn = smn
  privatedns_last = content
end

-- Never proxy zone transfers on the public listener
addAction(OrRule{QTypeRule(DNSQType.AXFR), QTypeRule(DNSQType.IXFR)}, RCodeAction(DNSRCode.REFUSED))

--Allow TXT only
smn = newSuffixMatchNode()
smn:add(newDNSName("pdns.platform.genesis-core.tech."));
-- NS
addAction(QNameRule("pdns.platform.genesis-core.tech"), QPSPoolAction(100, "privatedns"))
-- DNS01 acme challenges (it requires valid TXT answer and any CAA answer)
addAction(AndRule{SuffixMatchNodeRule(smn), QTypeRule(16), RegexRule("_acme-challenge\\..*")}, QPSPoolAction(100, "privatedns"))
addAction(AndRule{SuffixMatchNodeRule(smn), QTypeRule(257)}, RCodeAction(0))

-- Core DNS domains (dynamic). Must stay after the rules above: Pool stops
-- rule processing, so a listed parent domain would otherwise bypass them.
-- QPSPoolAction does not stop processing once over the limit, so queries
-- under pdns.platform are excluded explicitly.
addAction(NotRule(SuffixMatchNodeRule(smn)), LuaAction(function(dq)
  if privatedns_smn:check(dq.qname) then
    return DNSAction.Pool, "privatedns"
  end
  return DNSAction.None, ""
end))
